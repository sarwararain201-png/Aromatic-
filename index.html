<script>

async function addComment() {

  const nameInput = document.getElementById("commentName");
  const textInput = document.getElementById("commentText");
  const status = document.getElementById("commentStatus");
  const button = document.getElementById("commentBtn");

  const name = nameInput.value.trim();
  const comment = textInput.value.trim();

  if (!name || !comment) {
    status.textContent = "⚠️ Name aur comment dono likho.";
    return;
  }

  button.disabled = true;
  button.textContent = "Posting... 💕";
  status.textContent = "";

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/comments",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=minimal"
        },

        body: JSON.stringify({
          name: name,
          comment: comment
        })
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(errorText || "Comment post failed");

    }

    nameInput.value = "";
    textInput.value = "";

    status.textContent = "❤️ Comment successfully posted!";

    await loadComments();

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Comment post nahi hua. Supabase settings check karo.";

  }

  button.disabled = false;
  button.textContent = "💖 Post Comment";
}


async function loadComments() {

  const container =
    document.getElementById("commentsContainer");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/comments?select=*&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Could not load comments");
    }

    const comments = await response.json();

    if (!comments.length) {

      container.innerHTML =
        '<p class="no-comments">Abhi koi memory nahi hai 💕</p>';

      return;
    }

    container.innerHTML = comments.map(item => {

      const safeName =
        escapeHTML(item.name || "Anonymous");

      const safeComment =
        escapeHTML(item.comment || "");

      const date =
        item.created_at
          ? new Date(item.created_at).toLocaleString()
          : "";

      return `
        <div class="comment-card">

          <div class="comment-name">
            ❤️ ${safeName}
          </div>

          <div class="comment-text">
            ${safeComment}
          </div>

          <div class="comment-date">
            ${date}
          </div>

        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<p class="no-comments">Memories load nahi ho sakin 😔</p>';

  }
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


document.addEventListener("DOMContentLoaded", function() {

  loadComments();

});

<script>

async function updateMemoryCount() {

  const countElement =
    document.getElementById("memoryCount");

  if (!countElement) return;

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/comments?select=id",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "count=exact"
        }
      }
    );

    const range =
      response.headers.get("Content-Range");

    if (range) {

      const total =
        range.split("/")[1];

      if (total && total !== "*") {
        countElement.textContent = total;
        return;
      }

    }

    const data = await response.json();

    if (Array.isArray(data)) {
      countElement.textContent = data.length;
    }

  } catch (error) {

    console.log("Memory count error:", error);

  }

}

document.addEventListener(
  "DOMContentLoaded",
  updateMemoryCount
);

</script>

<script>

function createHeart() {

  const heart = document.createElement("div");

  heart.innerHTML = "❤️";

  heart.style.position = "fixed";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "-30px";
  heart.style.fontSize =
    (16 + Math.random() * 18) + "px";
  heart.style.pointerEvents = "none";
  heart.style.zIndex = "9999";
  heart.style.opacity = "0";

  heart.style.transition =
    "transform 4s ease-out, opacity 1s ease-out";

  document.body.appendChild(heart);

  requestAnimationFrame(() => {

    heart.style.opacity = "0.8";

    heart.style.transform =
      "translateY(-110vh) rotate(" +
      (Math.random() * 120 - 60) +
      "deg)";

  });

  setTimeout(() => {

    heart.remove();

  }, 4200);

}


function startHeartEffect() {

  setInterval(() => {

    createHeart();

  }, 1800);

}


function addButtonEffect() {

  document.addEventListener("click", function(event) {

    const button =
      event.target.closest("button");

    if (!button) return;

    button.style.transform = "scale(0.94)";

    setTimeout(() => {

      button.style.transform = "";

    }, 120);

  });

}


function smoothScrollLinks() {

  document.querySelectorAll(
    'a[href^="#"]'
  ).forEach(link => {

    link.addEventListener("click", function(event) {

      const target =
        document.querySelector(
          this.getAttribute("href")
        );

      if (!target) return;

      event.preventDefault();

      target.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    });

  });

}


document.addEventListener(
  "DOMContentLoaded",
  function() {

    startHeartEffect();

    addButtonEffect();

    smoothScrollLinks();

  }
);

</script>
